name: Actualizar tipo de cambio digital

on:
  workflow_dispatch:
  schedule:
    - cron: "15 08 * * *"

permissions:
  contents: write

jobs:
  generar-excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_excel.py
      - name: Guardar Excel actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tipo_cambio_digital.xlsx
          git diff --cached --quiet || git commit -m "Actualizar tipo de cambio digital"
          git push
